name: Package Windows installers
on:
  workflow_call:
    inputs:
      browser-commit:
        type: string
        required: true
      updater-ref:
        type: string
        required: true
      base-version:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.repository == 'perpetus/krypton-windows'
    runs-on: windows-2025-vs2026
    environment: installer-signing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/KryptonUpdater
          ref: ${{ inputs.updater-ref }}
          path: updater
          persist-credentials: false
      - uses: ./updater/.github/actions/prepare-hosted
      - name: Download browser distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: krypton-windows-x64-build
          path: ${{ runner.temp }}/krypton-package/browser
      - name: Download matching UI runtime
        uses: actions/download-artifact@v8.0.2
        with:
          name: krypton-ui-runtime
          path: ${{ runner.temp }}/krypton-package/ui-runtime
      - name: Verify artifact provenance and hashes
        id: artifacts
        shell: pwsh
        env:
          PAYLOAD_ROOT: ${{ runner.temp }}/krypton-package
          EXPECTED_COMMIT: ${{ inputs.browser-commit }}
        run: |
          python updater/tools/ci/verify-inputs.py --directory $env:PAYLOAD_ROOT --run-id $env:GITHUB_RUN_ID --commit $env:EXPECTED_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -LiteralPath "$env:PAYLOAD_ROOT/browser/browser-build.json" -Raw | ConvertFrom-Json
          "ui-commit=$($record.ui_commit)" >> $env:GITHUB_OUTPUT
          "version=$($record.product_version)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/KryptonUI
          ref: ${{ steps.artifacts.outputs.ui-commit }}
          path: ui-source
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/Krypton
          ref: ${{ inputs.browser-commit }}
          submodules: recursive
          path: browser-source
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/krypton-windows
          ref: ${{ github.sha }}
          path: release-source
          persist-credentials: false
      - name: Fetch and verify the optional update base
        shell: pwsh
        env:
          BASE_VERSION: ${{ inputs.base-version }}
        run: |
          python updater/tools/ci/fetch-base.py --version $env:BASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify signed installers and source archive
        shell: pwsh
        env:
          PAYLOAD_ROOT: ${{ runner.temp }}/krypton-package
          KRYPTON_RELEASE_KEY_PKCS8: ${{ secrets.KRYPTON_RELEASE_KEY_PKCS8 }}
        run: |
          ./updater/tools/ci/package.ps1 -PayloadRoot $env:PAYLOAD_ROOT -UiSource "$env:GITHUB_WORKSPACE/ui-source" -BrowserSource "$env:GITHUB_WORKSPACE/browser-source" -ReleaseSource "$env:GITHUB_WORKSPACE/release-source"
      - name: Upload complete stable release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-release-assets-${{ steps.artifacts.outputs.version }}
          path: release-source/release-assets/v${{ steps.artifacts.outputs.version }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload structured packaging provenance
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-installer-provenance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/krypton-package/dist/build-info.json
          if-no-files-found: ignore
          retention-days: 14
