name: Package Windows installers

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      browser-run-id:
        description: Successful Build Windows browser run in perpetus/Krypton
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: krypton-installer-signing
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' && (github.repository == 'perpetus/Krypton' || github.repository == 'perpetus/KryptonUpdater')
    runs-on: [self-hosted, Windows, X64, krypton-signing]
    environment: installer-signing
    timeout-minutes: 180
    env:
      KRYPTON_NINJA: ${{ vars.KRYPTON_NINJA }}
      KRYPTON_RELEASE_KEY_PATH: ${{ vars.KRYPTON_RELEASE_KEY_PATH }}
    steps:
      - name: Preserve existing signing-runner source checkouts
        shell: pwsh
        run: |
          foreach ($directory in @('updater', 'ui-source')) {
            if (Test-Path -LiteralPath "$directory/.git") {
              $changes = git -C $directory status --porcelain
              if ($LASTEXITCODE -ne 0 -or $changes) { throw "Local changes exist in $directory; preserve them before checkout." }
            } elseif (Test-Path -LiteralPath "$directory/out") {
              throw "Build state exists without its Git checkout in $directory; preserve it."
            }
          }
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/KryptonUpdater
          ref: main
          path: updater
          clean: false
          persist-credentials: false
      - name: Require a successful trusted source run for manual packaging
        id: source
        if: github.repository == 'perpetus/KryptonUpdater'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.browser-run-id }}
        run: |
          if ($env:BUILD_RUN -notmatch '^\d+$') { throw 'Expected a browser workflow run ID.' }
          $run = gh api "repos/perpetus/Krypton/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/main.yml' -or $run.event -ne 'workflow_dispatch') {
            throw 'Only a trusted manual browser build from main can be packaged.'
          }
          $jobs = gh api "repos/perpetus/Krypton/actions/runs/$env:BUILD_RUN/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not @($jobs.jobs | Where-Object { $_.name -eq 'browser' -and $_.conclusion -eq 'success' }).Count) { throw 'The browser build job did not succeed.' }
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Download browser distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: krypton-windows-x64-build
          path: ${{ runner.temp }}/krypton-package-${{ github.run_id }}-${{ github.run_attempt }}/browser
          repository: perpetus/Krypton
          run-id: ${{ inputs.browser-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download matching UI runtime
        uses: actions/download-artifact@v8.0.2
        with:
          name: krypton-ui-runtime
          path: ${{ runner.temp }}/krypton-package-${{ github.run_id }}-${{ github.run_attempt }}/ui-runtime
          repository: perpetus/Krypton
          run-id: ${{ inputs.browser-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact provenance and hashes
        id: artifacts
        shell: pwsh
        env:
          PAYLOAD_ROOT: ${{ runner.temp }}/krypton-package-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_RUN: ${{ inputs.browser-run-id || github.run_id }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit || github.sha }}
        run: |
          python updater/tools/ci/verify-inputs.py --directory $env:PAYLOAD_ROOT --run-id $env:EXPECTED_RUN --commit $env:EXPECTED_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -LiteralPath "$env:PAYLOAD_ROOT/browser/browser-build.json" -Raw | ConvertFrom-Json
          "ui-commit=$($record.ui_commit)" >> $env:GITHUB_OUTPUT
      - name: Check out matching UI prerequisite configuration
        uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/KryptonUI
          ref: ${{ steps.artifacts.outputs.ui-commit }}
          path: ui-source
          clean: false
          persist-credentials: false
      - name: Build and verify signed installers
        shell: pwsh
        env:
          PAYLOAD_ROOT: ${{ runner.temp }}/krypton-package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./updater/tools/ci/package.ps1 -PayloadRoot $env:PAYLOAD_ROOT -UiSource "$env:GITHUB_WORKSPACE/ui-source"
      - name: Upload installers and signed update assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-windows-installers
          path: ${{ runner.temp }}/krypton-package-${{ github.run_id }}-${{ github.run_attempt }}/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-installer-logs
          path: updater/out/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
